name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🚀 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install EAS CLI & Dependencies
        run: |
          npm install -g eas-cli
          npm install --legacy-peer-deps

      - name: ⚙️ Build Local APK with EAS
        run: |
          eas build --platform android --profile preview --local --output ./app-debug.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Supreme-APK
          path: ./app-debug.apk
