name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🚀 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies & EAS CLI
        run: |
          npm install -g eas-cli
          npm install --legacy-peer-deps

      - name: 🛠️ Build APK Locally (No Login Required)
        env:
          EAS_NO_VCS: '1'
          CI: '1'
        run: |
          npx eas-cli build --platform android --profile preview --local --output ./LudoSupreme.apk --non-interactive

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Supreme-APK
          path: ./LudoSupreme.apk
          
